name: Weekly changelog

# Posts the week's releases and unreleased merges to Discord through a channel webhook.
# Reports versions only; release.yml still cuts every release. Needs the DISCORD_WEBHOOK_URL secret.

on:
  schedule:
    - cron: '0 15 * * 1'   # Mondays 15:00 UTC
  workflow_dispatch:
    inputs:
      since:
        description: 'Start date (UTC, YYYY-MM-DD). Empty means the last 7 days.'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SINCE: ${{ inputs.since }}
        run: node scripts/weekly-changelog.mjs ${SINCE:+--since "$SINCE"}
